<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Chicken KS Tubun - Price List</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- HEADER & SEARCH -->
    <header class="bg-red-600 text-white p-6 sticky top-0 z-50 shadow-md">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold uppercase tracking-wider text-yellow-300">RC KS Tubun</h1>
                <p class="text-xs opacity-90">Praktis • Lengkap • Terbaru</p>
            </div>
            <!-- Tombol Admin Panel -->
            <button onclick="toggleAdminMode()" id="adminBtn" class="bg-black text-yellow-300 text-xs px-3 py-1.5 rounded-full font-semibold border border-yellow-300 hover:bg-yellow-300 hover:text-black transition">
                Admin Panel
            </button>
        </div>
        <div class="max-w-3xl mx-auto mt-4">
            <input type="text" id="searchInput" placeholder="Cari menu, paket, atau minuman..." onkeyup="filterMenus()" class="w-full px-4 py-2 rounded-full text-gray-800 text-sm outline-none shadow-inner">
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-3xl mx-auto px-4 mt-6">
        
        <!-- TAMPILAN KATALOG PELANGGAN -->
        <div id="customerView">
            <div id="nav-container" class="flex overflow-x-auto gap-2 pb-2 mb-4 scrollbar-none"></div>
            <div id="loading" class="text-center py-10 font-semibold text-red-600">Memuat daftar harga menu...</div>
            <div id="menu-container"></div>
            <div id="empty-msg" class="hidden text-center py-10 text-gray-500 font-medium">Menu tidak ditemukan.</div>
        </div>

        <!-- TAMPILAN PANEL ADMIN -->
        <div id="adminView" class="hidden bg-white p-6 rounded-xl shadow-lg border border-gray-200 mt-4">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-lg font-bold text-red-600">Kelola Harga & Ketersediaan</h2>
                <button onclick="logoutAdmin()" class="bg-gray-200 text-gray-700 text-xs px-3 py-1 rounded font-bold">Keluar Admin</button>
            </div>

            <!-- Form Login Admin -->
            <div id="loginBox" class="max-w-sm mx-auto py-6">
                <p class="text-sm font-semibold mb-3 text-center">Silakan Login Admin Supabase</p>
                <input type="email" id="adminEmail" placeholder="Email Admin" class="w-full p-2 mb-3 border rounded text-sm">
                <input type="password" id="adminPassword" placeholder="Password" class="w-full p-2 mb-4 border rounded text-sm">
                <button onclick="loginAdmin()" class="w-full bg-red-600 text-white py-2 rounded font-bold text-sm hover:bg-red-700">Masuk</button>
                <p id="loginError" class="text-red-500 text-xs mt-2 text-center"></p>
            </div>

            <!-- Daftar Edit Menu -->
            <div id="adminListContainer" class="hidden space-y-4">
                <div id="adminMenuRows"></div>
            </div>
        </div>

    </main>

    <footer class="text-center text-xs text-gray-500 mt-10">
        &copy; Rocket Chicken KS Tubun. Harga dapat berubah sewaktu-waktu.
    </footer>

    <!-- SCRIPT TUNGGAL (HANYA ADA 1 INISIALISASI SUPABASE) -->
    <script>
        const SUPABASE_URL = 'https://ulpckwlazrnhxvjthlgh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVscckwlazdsYXpybmh4dnJ0aGxnaCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzkxODg1Mjc3LCJleHAiOjIxMDc0NjEyNzd9.IBEZUs2-n0drXoL7nlD4XbootmlVr7Ss_itYzuCsJSo';

        // Inisialisasi Klien Supabase (Hanya sekali di sini)
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let allMenus = [];

        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        async function init() {
            await fetchMenus();
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminListContainer').classList.remove('hidden');
                loadAdminMenus();
            }
        }

        async function fetchMenus() {
            const { data, error } = await supabase
                .from('menu_items')
                .select('*')
                .eq('active', true)
                .order('price', { ascending: true });

            if (error) {
                document.getElementById('loading').innerText = "Gagal memuat menu: " + error.message;
                console.error(error);
                return;
            }

            allMenus = data || [];
            document.getElementById('loading').style.display = 'none';
            renderCustomerMenus(allMenus);
        }

        function renderCustomerMenus(menus) {
            const container = document.getElementById('menu-container');
            const navContainer = document.getElementById('nav-container');
            container.innerHTML = '';
            navContainer.innerHTML = '';

            if (menus.length === 0) {
                document.getElementById('empty-msg').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-msg').classList.add('hidden');
            }

            const grouped = menus.reduce((acc, m) => {
                if (!acc[m.category]) acc[m.category] = [];
                acc[m.category].push(m);
                return acc;
            }, {});

            const order = ["Paket Promo", "Paket Catering", "Paket Segar", "Lainnya", "Chicken Produk", "Paket Bucket", "Ayam Utuh", "Paket Rocket", "Paket Sehat", "Paket Roma", "Paket Geprek", "Paket Hot Cheesy", "Minuman"];

            order.forEach(cat => {
                if (grouped[cat] && grouped[cat].length > 0) {
                    const id = cat.toLowerCase().replace(/\s+/g, '-');
                    navContainer.innerHTML += `<a href="#${id}" class="px-3 py-1 bg-gray-200 text-xs rounded-full whitespace-nowrap font-semibold hover:bg-red-600 hover:text-white transition">${cat}</a>`;

                    let html = `<div id="${id}" class="mb-8"><h3 class="text-base font-bold text-red-600 border-b-2 border-yellow-400 pb-1 mb-3">${cat}</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
                    
                    grouped[cat].forEach(item => {
                        html += `
                            <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex justify-between items-center border-l-4 border-l-yellow-400">
                                <div class="pr-3">
                                    <h4 class="font-bold text-sm">${item.name}</h4>
                                    <p class="text-xs text-gray-500">${item.description || ''}</p>
                                </div>
                                <span class="bg-black text-yellow-300 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">${formatRupiah(item.price)}</span>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                    container.innerHTML += html;
                }
            });
        }

        function filterMenus() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMenus.filter(i => i.name.toLowerCase().includes(keyword) || (i.description && i.description.toLowerCase().includes(keyword)));
            renderCustomerMenus(filtered);
        }

        function toggleAdminMode() {
            const custView = document.getElementById('customerView');
            const adminView = document.getElementById('adminView');
            if (adminView.classList.contains('hidden')) {
                custView.classList.add('hidden');
                adminView.classList.remove('hidden');
                document.getElementById('adminBtn').innerText = "Lihat Katalog";
            } else {
                adminView.classList.add('hidden');
                custView.classList.remove('hidden');
                document.getElementById('adminBtn').innerText = "Admin Panel";
                fetchMenus();
            }
        }

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const err = document.getElementById('loginError');
            
            err.innerText = "Memeriksa...";
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                err.innerText = "Login gagal. Cek email/password.";
            } else {
                err.innerText = "";
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminListContainer').classList.remove('hidden');
                loadAdminMenus();
            }
        }

        async function logoutAdmin() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function loadAdminMenus() {
            const { data, error } = await supabase.from('menu_items').select('*').order('category');
            if (error) return;

            const container = document.getElementById('adminMenuRows');
            container.innerHTML = '';

            data.forEach(item => {
                container.innerHTML += `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 border-b gap-2 text-sm">
                        <div>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${item.category}</span>
                            <p class="font-bold mt-1">${item.name}</p>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                            <label class="text-xs flex items-center gap-1"><input type="checkbox" id="act-${item.id}" ${item.active ? 'checked' : ''}> Aktif</label>
                            <input type="number" id="prc-${item.id}" value="${item.price}" class="w-24 p-1 border rounded text-xs">
                            <button onclick="saveItem('${item.id}')" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold hover:bg-green-700">Simpan</button>
                        </div>
                    </div>
                `;
            });
        }

        async function saveItem(id) {
            const price = parseInt(document.getElementById(`prc-${id}`).value);
            const active = document.getElementById(`act-${id}`).checked;
            const btn = event.target;

            btn.innerText = "Menyimpan...";
            const { error } = await supabase.from('menu_items').update({ price, active }).eq('id', id);

            if (error) {
                alert("Gagal menyimpan");
                btn.innerText = "Simpan";
            } else {
                btn.innerText = "Berhasil ✓";
                setTimeout(() => btn.innerText = "Simpan", 1500);
            }
        }

        init();
    </script>
</body>
</html>
