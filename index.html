const CATEGORY_ORDER = ["Paket Promo","Paket Catering","Paket Segar","Paket Rocket","Paket Sehat","Paket Roma","Chicken Produk","Paket Bucket","Ayam Utuh","Paket Geprek Sambal Bawang","Paket Geprek Sambal Matah","Paket Geprek Sambal Terasi","Paket Hot Cheesy","Minuman","Lainnya"];
const CATEGORY_DESC = {
"Paket Promo":"Promo pilihan yang ditampilkan di bagian atas.",
"Paket Catering":"Pilihan paket untuk kebutuhan catering.",
"Paket Murmer":"Chicken Steak Murmer — pilihan hemat.",
"Paket Family Bucket":"Paket bucket untuk dinikmati bersama keluarga.",
"Paket Segar":"Paket ayam, nasi, dan es teh.",
"Paket Rocket":"Paket favorit dengan Nestea.",
"Paket Sehat":"Paket dengan minuman Milo.",
"Paket Roma":"Paket dengan Teh Botol.",
"Chicken Produk":"Pilihan potongan ayam crispy.",
"Paket Bucket":"Pilihan bucket ayam.",
"Ayam Utuh":"Ayam utuh dengan pilihan rasa.",
"Paket Geprek Sambal Bawang":"Paket geprek dengan sambal bawang.",
"Paket Geprek Sambal Matah":"Paket dengan sambal matah.",
"Paket Geprek Sambal Terasi":"Paket dengan sambal terasi.",
"Paket Hot Cheesy":"Paket dan produk dengan saus Hot Cheesy.",
"Minuman":"Minuman dingin dan minuman botol.",
"Lainnya":"Menu satuan dan menu tambahan."
};
let allMenus = [];
let selectedCategory = "Semua";
let query = "";
const $ = s => document.querySelector(s);
const rupiah = n => "Rp" + Number(n||0).toLocaleString("id-ID");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function displayCategory(m){return m.display_category || m.category || "Lainnya"}
function cardHTML(m, promo=false){
  return `<article class="card ${promo?'promo':''}"><span class="pill">${esc(displayCategory(m))}</span><h3>${esc(m.name)}</h3><p>${esc(m.description||"Menu Rocket Chicken")}</p><div class="price">${rupiah(m.price)}</div></article>`;
}
function render(){
 const active = allMenus.filter(m=>m.active!==false);
 const matches = active.filter(m=>(`${m.name} ${m.description||""} ${m.search_terms||""} ${displayCategory(m)}`).toLowerCase().includes(query.toLowerCase()));
 const isSearching = !!query;
 $("#searchResults").classList.toggle("hidden",!isSearching);
 $("#promoArea").classList.toggle("hidden",isSearching);
 $("#sections").classList.toggle("hidden",isSearching);
 if(isSearching){
   $("#resultsRail").innerHTML = matches.length ? matches.map(m=>cardHTML(m, false)).join("") : '<div class="empty">Menu tidak ditemukan. Coba kata kunci lain.</div>';
   $("#searchCount").textContent = `${matches.length} menu ditemukan`;
 } else {
   const promo = active.filter(m=>["Paket Murmer","Paket Family Bucket"].includes(displayCategory(m)) || (displayCategory(m)==="Paket Promo"));
   $("#promoRail").innerHTML = promo.length ? promo.map(m=>cardHTML(m,true)).join("") : '<div class="empty">Belum ada promo aktif.</div>';
   const sections = CATEGORY_ORDER.filter(c=>active.some(m=>displayCategory(m)===c) && c!=="Paket Promo");
   $("#sections").innerHTML = sections.map(c=>{
     const items = active.filter(m=>displayCategory(m)===c);
     return `<section class="section" id="${slug(c)}"><div class="section-head"><div><h2>${esc(c)}</h2><p>${esc(CATEGORY_DESC[c]||"Pilihan menu tersedia")}</p></div><a class="more" href="#${slug(c)}" data-expand="${esc(c)}">Geser untuk lihat →</a></div><div class="rail">${items.map(m=>cardHTML(m)).join("")}</div></section>`;
   }).join("");
 }
 $("#status").textContent = `${active.length} menu aktif • Data diperbarui otomatis saat halaman dimuat`;
 renderFilters();
}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function renderFilters(){
 const cats = ["Semua",...CATEGORY_ORDER.filter(c=>allMenus.some(m=>displayCategory(m)===c))];
 $("#filters").innerHTML = cats.map(c=>`<button class="chip ${selectedCategory===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
 $("#filters").querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{
   selectedCategory=b.dataset.cat;
   if(selectedCategory!=="Semua"){const el=document.getElementById(slug(selectedCategory));if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
   render();
 }));
}
$("#searchForm").addEventListener("submit",e=>{e.preventDefault();query=$("#search").value.trim();render()});
$("#search").addEventListener("input",()=>{query=$("#search").value.trim();render()});
async function loadMenu(){
  try{
    if(window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes("GANTI_")){
      const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
      const {data,error}=await client.from("menus").select("*").eq("active",true).order("sort_order",{ascending:true}).order("name");
      if(error) throw error;
      if(data && data.length){allMenus=data.map(m=>({...m,display_category:m.display_category||m.category}));render();return;}
    }
  }catch(e){console.warn("Supabase belum siap, memakai data CSV lokal.",e.message)}
  allMenus=LOCAL_MENU;
  render();
}
loadMenu();
</script>
