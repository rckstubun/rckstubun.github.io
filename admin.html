<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - RC KS Tubun</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --rc-red: #d32f2f; --rc-yellow: #fbc02d; --rc-black: #212121; }
        body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: var(--rc-red); text-align: center; }
        #login-section { max-width: 300px; margin: 50px auto; text-align: center; }
        input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: var(--rc-red); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button.full { width: 100%; }
        button:hover { opacity: 0.9; }
        #dashboard-section { display: none; }
        .header-dash { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--rc-yellow); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-logout { background: var(--rc-black); }
        .category-group { margin-bottom: 30px; }
        .category-group h3 { background: var(--rc-yellow); padding: 5px 10px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
        .edit-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; gap: 10px; }
        .edit-row p { margin: 0; font-weight: bold; flex: 1; min-width: 200px; }
        .edit-controls { display: flex; gap: 15px; align-items: center; }
        .edit-controls input[type="number"] { width: 100px; padding: 5px; }
        .switch-wrapper { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; }
        .btn-save { background: #2e7d32; }
        .inactive-text { color: #aaa; text-decoration: line-through; }
    </style>
</head>
<body>

<div class="container">
    <h1>Admin Panel RC</h1>

    <div id="login-section">
        <p>Login untuk Mengubah Menu</p>
        <input type="email" id="email" placeholder="Email Admin">
        <input type="password" id="password" placeholder="Password">
        <button class="full" onclick="login()">Masuk</button>
        <p id="login-msg" style="color:red; font-size: 0.9em;"></p>
    </div>

    <div id="dashboard-section">
        <div class="header-dash">
            <h2>Pengaturan Menu</h2>
            <button class="btn-logout" onclick="logout()">Keluar</button>
        </div>
        <div id="admin-menus">Memuat data dari database...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ulpckwlazrnhxvjthlgh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVscGNrd2xhenJuaHh2anRobGdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODUyNzcsImV4cCI6MjEwNzQ2MTI3N30.IBEZUs2-n0drXoL7nlD4XbootmlVr7Ss_itYzuCsJSo';
    
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) showDashboard();
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msg = document.getElementById('login-msg');
        
        msg.innerText = "Memeriksa kredensial...";
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
            msg.innerText = "Gagal login. Email/password salah.";
        } else { 
            msg.innerText = ""; 
            showDashboard(); 
        }
    }

    async function logout() {
        await supabase.auth.signOut();
        location.reload();
    }

    function showDashboard() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
        loadMenus();
    }

    async function loadMenus() {
        const { data, error } = await supabase.from('menu_items').select('*').order('category');
        if (error) return console.error(error);

        const container = document.getElementById('admin-menus');
        container.innerHTML = '';

        const grouped = data.reduce((acc, menu) => {
            if (!acc[menu.category]) acc[menu.category] = [];
            acc[menu.category].push(menu);
            return acc;
        }, {});

        for (const cat in grouped) {
            let html = `<div class="category-group"><h3>${cat}</h3>`;
            grouped[cat].forEach(item => {
                const isChecked = item.active ? "checked" : "";
                const titleClass = item.active ? "" : "inactive-text";
                
                html += `
                    <div class="edit-row">
                        <p class="${titleClass}" id="title-${item.id}">${item.name}</p>
                        <div class="edit-controls">
                            <div class="switch-wrapper">
                                <input type="checkbox" id="active-${item.id}" ${isChecked}>
                                <label>Tersedia</label>
                            </div>
                            <input type="number" id="price-${item.id}" value="${item.price}">
                            <button class="btn-save" onclick="updateItem('${item.id}')">Simpan</button>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML += html;
        }
    }

    async function updateItem(id) {
        const newPrice = document.getElementById(`price-${id}`).value;
        const isActive = document.getElementById(`active-${id}`).checked;
        const btn = event.target;
        
        btn.innerText = "⏳";

        const { error } = await supabase
            .from('menu_items')
            .update({ price: parseInt(newPrice), active: isActive })
            .eq('id', id);

        if (error) {
            alert("Gagal menyimpan.");
            btn.innerText = "Simpan";
        } else {
            btn.innerText = "✓ Tersimpan";
            btn.style.background = "#1976d2";
            
            const titleEl = document.getElementById(`title-${id}`);
            if(isActive) titleEl.classList.remove('inactive-text');
            else titleEl.classList.add('inactive-text');

            setTimeout(() => { 
                btn.innerText = "Simpan"; 
                btn.style.background = "#2e7d32"; 
            }, 1500);
        }
    }
</script>
</body>
</html>
